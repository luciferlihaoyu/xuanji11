# ============================================================
# 璇玑智脑 - 本地 Docker Compose 测试配置
#
# 使用方法:
#   1. 复制 .env 为 .env.local 并修改配置
#   2. docker compose up --build
#   3. 访问 http://localhost:3000
#
# 数据库: 已内嵌 SQLite（单文件），由 SQLITE_PATH 指定，默认
#   /data/app/xuanji.db，挂载到命名卷持久化。原 DATABASE_URL 已废弃。
# ============================================================

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 数据库：内嵌 SQLite 文件路径（替代已废弃的 DATABASE_URL）
      - SQLITE_PATH=${SQLITE_PATH:-/data/app/xuanji.db}
      # 本地管理员认证（env.ts 必填，缺失会拒绝启动）
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # 以下 Kimi OAuth 可选项请在 Zeabur 面板 / .env 中配置
      - APP_ID=${APP_ID}
      - APP_SECRET=${APP_SECRET}
      - KIMI_AUTH_URL=${KIMI_AUTH_URL}
      - KIMI_OPEN_URL=${KIMI_OPEN_URL}
      - VITE_APP_ID=${VITE_APP_ID}
      - VITE_KIMI_AUTH_URL=${VITE_KIMI_AUTH_URL}
      - OWNER_UNION_ID=${OWNER_UNION_ID}
    volumes:
      # SQLite + 上传 + 备份统一持久化到命名卷
      - xuanji-data:/data/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/trpc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  xuanji-data:

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>璇玑脑图 · 3D 星云预览（WebGL + Bloom）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060b;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #graph { position: fixed; inset: 0; }
  .hud { position: fixed; left: 18px; top: 16px; z-index: 10; color: #9fb4d8; font-size: 12px;
    letter-spacing: .4px; user-select: none; pointer-events: none; }
  .hud b { color: #e6edf7; font-size: 15px; display: block; margin-bottom: 4px; letter-spacing: 1.5px; }
  .legend { position: fixed; right: 18px; top: 16px; z-index: 10; color: #9fb4d8; font-size: 12px;
    line-height: 22px; background: rgba(12,16,26,.55); border: 1px solid rgba(120,160,220,.14);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
    box-shadow: 0 0 8px currentColor; background: currentColor; }
  .hint { position: fixed; left: 18px; bottom: 16px; z-index: 10; color: #6c7f9f; font-size: 11px; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9fb4d8; font-size: 13px; letter-spacing: 2px; z-index: 20; background: #04060b;
    transition: opacity .6s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "3d-force-graph": "https://unpkg.com/3d-force-graph@1.73.6/dist/3d-force-graph.mjs"
} }
</script>
</head>
<body>
<div id="graph"></div>
<div class="hud"><b>璇玑 · 知识星云</b>3D WebGL + Bloom 辉光 · 真实数据预览</div>
<div class="legend" id="legend"></div>
<div class="hint">拖动旋转 · 滚轮缩放 · 悬停看名称 · 点击聚焦</div>
<div id="status">载入星云中…</div>
<script type="module">
import * as THREE from 'three';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import ForceGraph3D from '3d-force-graph';

const COLORS = { concept: '#4cc9f0', document: '#52e5a7', topic: '#ffc94d', entity: '#ff6b9d', note: '#a78bfa', tag: '#22d3ee' };
const LABELS = { concept: '概念', document: '文档', topic: '主题', entity: '实体', note: '笔记', tag: '标签' };
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(c => `<span style="color:${COLORS[c]}"><i></i></span>${LABELS[c]}`).join('<br>');

// 发光纹理：平滑径向渐变（WebGL 纹理缩放无锯齿问题）
const texCache = {};
function glowTexture(color) {
  if (texCache[color]) return texCache[color];
  const S = 128, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.18, color);
  g.addColorStop(0.45, color + '66');
  g.addColorStop(1, color + '00');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  texCache[color] = tex;
  return tex;
}

async function loadGraph() {
  const r = await fetch('/trpc/knowledge.getGraph', { credentials: 'same-origin' });
  if (!r.ok) throw new Error('HTTP ' + r.status + '（需先登录）');
  const payload = await r.json();
  // tRPC GET 响应：{ result: { data: { json: {...} } } }，兼容非超 JSON 形态
  const data = payload?.result?.data?.json ?? payload?.result?.data ?? payload;
  const nodes = (data.nodes || []).map(n => ({ id: n.id, name: n.title, cat: n.type || 'concept' }));
  const idSet = new Set(nodes.map(n => n.id));
  const links = (data.edges || [])
    .filter(e => idSet.has(e.sourceId) && idSet.has(e.targetId))
    .map(e => ({ source: e.sourceId, target: e.targetId }));
  // 度数
  const deg = {};
  links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  nodes.forEach(n => { n.deg = deg[n.id] || 0; });
  return { nodes, links };
}

const status = document.getElementById('status');
try {
  const gData = await loadGraph();
  status.style.opacity = '0';
  setTimeout(() => status.remove(), 700);

  const Graph = new ForceGraph3D(document.getElementById('graph'))
    .backgroundColor('rgba(0,0,0,0)')
    .graphData(gData)
    .nodeThreeObject(n => {
      const color = COLORS[n.cat] || COLORS.tag;
      const size = 6 + Math.min(14, Math.log(1 + n.deg) * 4);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTexture(color), color: 0xffffff, transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending,
      }));
      sprite.scale.set(size, size, 1);
      return sprite;
    })
    .nodeLabel(n => `${n.name} ｜ ${LABELS[n.cat] || n.cat}`)
    .linkColor(() => 'rgba(130,170,230,0.35)')
    .linkWidth(0.6)
    .linkOpacity(0.35)
    .linkDirectionalParticles(0)
    .onNodeClick(n => {
      // 点击聚焦：相机飞向节点
      const dist = 60;
      const ratio = 1 + dist / Math.hypot(n.x, n.y, n.z);
      Graph.cameraPosition({ x: n.x * ratio, y: n.y * ratio, z: n.z * ratio }, n, 1200);
    });

  // 背景星野：1200 个远景星点围成球壳
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(1200 * 3);
  for (let i = 0; i < 1200; i++) {
    const r = 900 + Math.random() * 1600;
    const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    starPos[i*3] = r * Math.sin(p) * Math.cos(t);
    starPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
    starPos[i*3+2] = r * Math.cos(p);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0x8fb4e8, size: 2.2, transparent: true, opacity: 0.55, sizeAttenuation: true,
  }));
  Graph.scene().add(stars);

  // Bloom 辉光（科技感核心）
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.7, 0.08);
  Graph.postProcessingComposer().addPass(bloom);

  // 缓慢自转（电影感）
  Graph.controls().autoRotate = true;
  Graph.controls().autoRotateSpeed = 0.6;
  Graph.cameraPosition({ x: 0, y: 0, z: 340 });

  document.querySelector('.hud b').textContent =
    `璇玑 · 知识星云（${gData.nodes.length} 节点 · ${gData.links.length} 边）`;
} catch (e) {
  status.textContent = '载入失败：' + e.message + ' —— 请先在主站登录后再打开本页';
}
</script>
</body>
</html>
